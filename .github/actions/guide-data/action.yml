name: Prepare guide data
description: Use the latest published guide data release, falling back to the committed data.
inputs:
  github-token:
    description: GitHub token used to read guide data releases.
    required: true
  use-release:
    description: Prefer the latest guide data release over the committed data.
    default: "true"
runs:
  using: composite
  steps:
    - name: Use guide data release or committed data
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        USE_RELEASE: ${{ inputs.use-release }}
      run: |
        set -euo pipefail
        use_release() {
          tag="$(gh release list --json tagName --jq '[.[].tagName | select(startswith("guide-data-"))] | sort | last // empty')"
          [ -n "${tag}" ] || return 1
          gh release download "${tag}" --pattern guide-data.tar.gz --dir guide-data-release
          mkdir guide-data-release/files
          tar xzf guide-data-release/guide-data.tar.gz -C guide-data-release/files
          deno run --allow-read scripts/validate-guide-data.ts guide-data-release/files/src/data
          cp guide-data-release/files/src/data/*.json src/data/
          mkdir -p public/guide-images
          cp -r guide-data-release/files/public/guide-images/. public/guide-images/
          echo "Using guide data release ${tag}."
        }
        if [ "${USE_RELEASE}" = true ] && use_release; then
          :
        elif deno run --allow-read scripts/validate-guide-data.ts src/data; then
          echo "Using committed guide data."
        else
          echo "No complete guide data was available; restoring seed data."
          deno task restore:guide
        fi
